[package]
name = "publist-bib-wasm"
version = "0.0.0"
edition = "2021"
publish = false
# src/sentence.rs is a port of MIT-licensed code, see LICENSE.MIT-bibtex-parser
license = "Apache-2.0 AND MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
biblatex = "0.10"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[profile.release]
opt-level = "s"
lto = true
