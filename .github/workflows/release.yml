name: release
on:
  push:
    tags:
    - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  id-token: write # Required for OIDC
  contents: read

# The tag and the GitHub Release (with changelog notes) are created by
# release-please when its release PR merges; this workflow only publishes
# the tagged version to npm.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish
